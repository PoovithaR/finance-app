<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Finance Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Personal Finance Tracker</h1>

    <div class="summary">

        <div class="card">
            <h3>Total Income</h3>
            <p id="total-income">₹0.00</p>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="total-expense">₹0.00</p>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <p id="balance">₹0.00</p>
        </div>

    </div>


    <div class="form-section">

        <h2>Add Transaction</h2>

        <form id="transaction-form">

            <input
                type="text"
                id="description"
                placeholder="Description"
                required
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                step="0.01"
                min="0.01"
                required
            >

            <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>

            <button type="submit">
                Add Transaction
            </button>

        </form>

    </div>


    <div class="transactions-section">

        <h2>Transactions</h2>

        <table>

            <thead>

                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="transaction-list">

            </tbody>

        </table>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
